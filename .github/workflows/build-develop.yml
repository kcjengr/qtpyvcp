name: Build Develop .deb

on:
  push:
    branches: [pyside6]
  pull_request:
    branches: [pyside6]
  workflow_dispatch:

jobs:z
  build:
    name: Develop .deb (${{ matrix.arch }})
    strategy:
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runs-on: ubuntu-latest
          - arch: arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    container:
      image: debian:trixie-slim

    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential devscripts debhelper dh-python \
            pybuild-plugin-pyproject \
            python3-pip python3-setuptools python3-poetry-core \
            python3-poetry-dynamic-versioning \
            pyside6-tools cmake \
            qt6-base-dev-tools qt6-base-dev qt6-tools-dev pybind11-dev \
            git ca-certificates curl gnupg openssh-client

      - name: Install build dependencies
        run: |
          apt-get install -y --no-install-recommends \
            python3-yaml \
            python3-pyside6.qtcore python3-pyside6.qtdbus \
            python3-pyside6.qtdesigner python3-pyside6.qtopengl \
            python3-pyside6.qtwidgets python3-pyside6.qtmultimedia \
            python3-pyside6.qtquick python3-pyside6.qtuitools \
            python3-pyside6.qsci python3-pyqt5.qsci \
            python3-qtpy \
            python3-six python3-docopt python3-pyudev \
            python3-psutil python3-markupsafe python3-opengl \
            python3-vtk9 python3-pyqtgraph python3-simpleeval \
            python3-jinja2 python3-deepdiff python3-sqlalchemy \
            python3-serial python3-distro \
            gstreamer1.0-plugins-bad libqt5multimedia5-plugins || true

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Mark repo as safe for git
        run: |
          git config --system --add safe.directory "$GITHUB_WORKSPACE"
          git config --system --add safe.directory /__w/qtpyvcp/qtpyvcp

      - name: Clean stale native artifacts
        run: |
          cd "$GITHUB_WORKSPACE"
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            find src/qtpyvcp/native -type f \( -name '*x86_64-linux-gnu.so' -o -name '*amd64*.so' \) -delete || true
          elif [ "${{ matrix.arch }}" = "amd64" ]; then
            find src/qtpyvcp/native -type f \( -name '*aarch64-linux-gnu.so' -o -name '*arm64*.so' \) -delete || true
          fi

      - name: Set develop version
        run: |
          cd "$GITHUB_WORKSPACE"
          export DEBFULLNAME="Kcjengr" DEBEMAIL="kcjengr@gmail.com"
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            COMMITS_SINCE=$(git rev-list --count HEAD)
            DEV_VERSION="0.0.0-${COMMITS_SINCE}.dev"
          else
            if git rev-parse "${LAST_TAG}" >/dev/null 2>&1; then
              COMMITS_SINCE=$(git rev-list --count "${LAST_TAG}..HEAD")
              DEV_VERSION="${LAST_TAG}-${COMMITS_SINCE}.dev"
            else
              COMMITS_SINCE=$(git rev-list --count HEAD)
              DEV_VERSION="0.0.0-${COMMITS_SINCE}.dev"
            fi
          fi
          if [ ! -f debian/changelog ]; then
            dch --create --package qtpyvcp -v "${DEV_VERSION}" \
              --distribution unstable "Development build"
          else
            dch --newversion "${DEV_VERSION}" \
              --distribution unstable "Development build"
          fi

      - name: Build .deb package
        run: |
          cd "$GITHUB_WORKSPACE"
          dpkg-buildpackage -b -us -uc -d
          mkdir -p /tmp/debs
          mv ../*.deb /tmp/debs/

      - name: Show built packages
        run: |
          ls -la /tmp/debs/
          for deb in /tmp/debs/*.deb; do
            echo "--- $deb ---"
            dpkg --info "$deb"
          done

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: qtpyvcp-develop-${{ matrix.arch }}
          path: /tmp/debs/*.deb
          retention-days: 7

      - name: Upload to apt repo
        env:
          APT_SSH_KEY: ${{ secrets.APT_SSH_KEY }}
          APT_USER: ${{ secrets.APT_USER }}
          APT_HOST: ${{ secrets.APT_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$APT_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          DEB_NAME=$(basename /tmp/debs/python3-qtpyvcp_*.deb)
          cat /tmp/debs/"$DEB_NAME" | ssh -i ~/.ssh/deploy_key -p 422 -o StrictHostKeyChecking=accept-new \
            "${APT_USER}@${APT_HOST}" \            "cat > /tmp/$$.deb && aptly repo add -force-replace -config=/home/buildbot/.aptly.conf trixie-dev /tmp/$$.deb && (aptly publish update -force-overwrite -config=/home/buildbot/.aptly.conf trixie-dev || aptly publish repo -force-overwrite -config=/home/buildbot/.aptly.conf -distribution=trixie-dev -architectures=amd64,arm64 trixie-dev) && rm /tmp/$$.deb""
          rm -f ~/.ssh/deploy_key
