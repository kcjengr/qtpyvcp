ini:
{% if ini.section is defined %}
section:
  {{ ini.section | to_yaml }}
  
{% endif %}



{% include "default_menubar.yml" %}




vcp:
  name: Not Set
  version: Not Set
  author: Not Set
  description: No description provided.

windows:
  mainwindow:
    provider: qtpyvcp.widgets.form_widgets.main_window:VCPMainWindow

# This sections defines the default Data Sources
data_plugins:
  status:
    provider: qtpyvcp.plugins.status:Status
    kwargs:
      cycle_time: 75

  persistent_data_manager:
    provider: qtpyvcp.plugins.persistent_data_manager:PersistentDataManager
    kwargs:
      # serialization method to use: json or pickle
      serialization_method: pickle
      # persistence_file: .vcp_data.json

  settings:
    provider: qtpyvcp.plugins.settings:Settings

  position:
    provider: qtpyvcp.plugins.positions:Position
    kwargs:
      report_actual_pos: True
      use_program_units: True

  tooltable:
    provider: qtpyvcp.plugins.tool_table:ToolTable

  var_file_manager:
    provider: qtpyvcp.plugins.var_file_manager:VarFileManager
    kwargs:
      # monitoring mode: can be 'polling' or 'filesystem'
      monitoring_mode: filesystem
      # polling interval in ms (only used if monitoring_mode is 'polling')
      polling_interval: 500

  offsettable:
    provider: qtpyvcp.plugins.offset_table:OffsetTable

  notifications:
    provider: qtpyvcp.plugins.notifications:Notifications
    kwargs:
      # show notification popups
      enabled: True
      # "native" or "dbus"
      mode: native
      # max number of notifications to show
      max_messages: 5
      # whether to save messages on exit
      persistent: True

  file_locations:
    provider: qtpyvcp.plugins.file_locations:FileLocations
    log_level: debug
    kwargs:
      default_location: NC Files
      local_locations:
        # format: Location Name: path
        Home: ~/
        Desktop: ~/Desktop
        NC Files: ~/linuxcnc/nc_files
      network_locations:

  exportedhal:
    provider: qtpyvcp.plugins.exported_hal:ExportedHal

  virtual_input:
    provider: qtpyvcp.plugins.virtual_input_manager:VirtualInputManager

dialogs:
  open_file:
    provider: qtpyvcp.widgets.dialogs.open_file_dialog:OpenFileDialog

  set_work_offsets:
    provider: qtpyvcp.widgets.dialogs.offsets_dialog:OffsetsDialog

  tool_edit:
    provider: qtpyvcp.widgets.dialogs.tool_edit_dialog:ToolEditDialog

  probe_sim:
    provider: qtpyvcp.widgets.dialogs.probesim_dialog:ProbeSim

  about_qtpyvcp:
    provider: qtpyvcp.widgets.dialogs.about_dialog:AboutDialog

  toolchange:
    provider: qtpyvcp.widgets.dialogs.toolchange_dialog:ToolChangeDialog

  shutdown:
    provider: qtpyvcp.widgets.dialogs.shutdown_dialog:ShutDownDialog

virtual_input_providers:
  number:
    provider: qtpyvcp.widgets.virtual_input.virtual_input:VirtualInput
    kwargs:
      ui_file: {{ file.dir }}/../widgets/virtual_input/numpad.ui

#  number.int:
#    provider: qtpyvcp.widgets.virtual_input.virtual_input:VirtualInput
#    kwargs:
#      ui_file: {{ file.dir }}/../widgets/virtual_input/numpad.ui
#
#  number.float:
#    provider: qtpyvcp.widgets.virtual_input.virtual_input:VirtualInput
#    kwargs:
#      ui_file: {{ file.dir }}/../widgets/virtual_input/numpad.ui

  text:
    provider: qtpyvcp.widgets.virtual_input.virtual_input:VirtualInput
    kwargs:
      ui_file: {{ file.dir }}/../widgets/virtual_input/keyboard.ui

#  text.gcode:
#    provider: qtpyvcp.widgets.virtual_input.virtual_input:VirtualInput
#    kwargs:
#      ui_file: {{ file.dir }}/../widgets/virtual_input/keyboard.ui

application:
  provider: qtpyvcp.app.application:VCPApplication
  kwargs:
#    stylesheet: {{ file.dir }}/widgets/default_stylesheet.qss   # application wide stylesheet

settings:
  touch-probe.diameter-offset:
    default_value: .123123
    persistent: true
    min_value: 0
    max_value: 1

  dro.display-units:
    default_value: 0
    options: [Auto, Inch, Metric]

  dro.lathe-radius-mode:
    default_value: 0
    options: [Auto, Radius, Diameter]

  dro.inch-format:
    default_value: '%9.4f'
    value_type: str

  dro.millimeter-format:
    default_value: '%9.3f'
    value_type: str

  dro.degree-format:
    default_value: '%9.2f'
    
  offset_table.min_range:
    default_value: -1000
    
  offset_table.max_range:
    default_value: 1000

  # VTK backplot view settings

  backplot.show-grid:
    default_value: false

  backplot.show-program-bounds:
    default_value: false

  backplot.show-machine-bounds:
    default_value: false

  backplot.show-machine-labels:
    default_value: false

  backplot.show-machine-ticks:
    default_value: false

  backplot.perspective-view:
    default_value: false

  backplot.view:
    default_value: 0
    options: ["X: Front View", "XZ: Lathe View", "XZ2: Lathe View", "Y: Front View", "Z: Top View", "Z2: Bottom View", "P: Isometric"]

  backplot.machine-ext-scale:
    default_value: 0.65

  backplot.multitool-colors:
    default_value: false

  # Core GCode editor syntax control settings.
  gcode-syntax.on-off:
    description: Enable GCode syntax highlighting in the native editor.
    default_value: false
    persistent: true

  gcode-syntax.user-color-1:
    default_value: "{{ '#78b4ff' if effective_theme_color('DISPLAY', 'THEME_COLOR', 'light') == 'dark' else '#2355aa' }}"
    value_type: str
    persistent: true

  gcode-syntax.user-color-2:
    default_value: "{{ '#ff96dc' if effective_theme_color('DISPLAY', 'THEME_COLOR', 'light') == 'dark' else '#872d82' }}"
    value_type: str
    persistent: true

  gcode-syntax.user-color-3:
    default_value: "{{ '#8cdc8c' if effective_theme_color('DISPLAY', 'THEME_COLOR', 'light') == 'dark' else '#1e731e' }}"
    value_type: str
    persistent: true

  gcode-syntax.user-color-4:
    default_value: "{{ '#ff9191' if effective_theme_color('DISPLAY', 'THEME_COLOR', 'light') == 'dark' else '#9b2323' }}"
    value_type: str
    persistent: true

  gcode-syntax.user-color-5:
    default_value: "{{ '#96c896' if effective_theme_color('DISPLAY', 'THEME_COLOR', 'light') == 'dark' else '#377837' }}"
    value_type: str
    persistent: true

  gcode-syntax.user-color-6:
    default_value: "{{ '#82dcdc' if effective_theme_color('DISPLAY', 'THEME_COLOR', 'light') == 'dark' else '#007882' }}"
    value_type: str
    persistent: true

# Core runtime-owned editor defaults. VCPs can override these in config files.
gcode_editor_style_defaults:
  background_color: "{{ '#6c6c6c' if effective_theme_color('DISPLAY', 'THEME_COLOR', 'light') == 'dark' else '#dfdfdf' }}"
  text_color: "{{ '#ffffff' if effective_theme_color('DISPLAY', 'THEME_COLOR', 'light') == 'dark' else '#000000' }}"
  padding: 2
  font_family: "Sans Serif"
  font_point_size: 11
  font_style: normal
  font_weight: 400
  border_radius: 2

  line_number_area_background: "{{ '#505050' if effective_theme_color('DISPLAY', 'THEME_COLOR', 'light') == 'dark' else '#cdcdcd' }}"
  line_number_area_color: "{{ '#ffffff' if effective_theme_color('DISPLAY', 'THEME_COLOR', 'light') == 'dark' else '#000000' }}"
  line_number_font_family: "Sans Serif"
  line_number_font_point_size: 10
  line_number_font_weight: 400
  line_number_font_italic: false

  current_line_highlight_enabled: true
  current_line_background: "{{ '#6c6ef0' if effective_theme_color('DISPLAY', 'THEME_COLOR', 'light') == 'dark' else '#bfc8ff' }}"
  current_line_color: "{{ '#ffffff' if effective_theme_color('DISPLAY', 'THEME_COLOR', 'light') == 'dark' else '#000000' }}"
  find_highlight_background: "{{ '#2848b9' if effective_theme_color('DISPLAY', 'THEME_COLOR', 'light') == 'dark' else '#9db6ff' }}"
  find_highlight_text: "{{ '#ffffff' if effective_theme_color('DISPLAY', 'THEME_COLOR', 'light') == 'dark' else '#000000' }}"
  find_error_background: "#ff0000"
  find_error_text: "#ffffff"
  find_status_background: "{{ '#5a5a5a' if effective_theme_color('DISPLAY', 'THEME_COLOR', 'light') == 'dark' else '#b7b7b7' }}"
  find_status_text: "{{ '#ffffff' if effective_theme_color('DISPLAY', 'THEME_COLOR', 'light') == 'dark' else '#000000' }}"
  find_status_border: "{{ '#5f5f5f' if effective_theme_color('DISPLAY', 'THEME_COLOR', 'light') == 'dark' else '#8f8f8f' }}"

# Core syntax profile consumed by VCPMainWindow runtime apply logic.
gcode_syntax_profile:
  version: 1
  model: flat-token-groups
  default_color: "{{ '#ffffff' if effective_theme_color('DISPLAY', 'THEME_COLOR', 'light') == 'dark' else '#000000' }}"
  syntax_styles:
    - id: Syntax_style_1
      setting: gcode-syntax.user-color-1
      tokens: [G]
    - id: Syntax_style_2
      setting: gcode-syntax.user-color-2
      tokens: [M]
    - id: Syntax_style_3
      setting: gcode-syntax.user-color-3
      tokens: [X, Y, Z, A, B, C, U, V, W, I, J, K, R, Q, P, F]
    - id: Syntax_style_4
      setting: gcode-syntax.user-color-4
      tokens: [number]
    - id: Syntax_style_5
      setting: gcode-syntax.user-color-5
      tokens: [semicolon, parenthesis, comment]
    - id: Syntax_style_6
      setting: gcode-syntax.user-color-6
      tokens: [single_quote, double_quote, string]
 
