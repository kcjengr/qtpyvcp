name: Release (develop, trixie-dev)

# Builds and publishes python3-qtpyvcp on every push to pyside6.
# Replaces the buildbot's qtpyvcp_pyside6_{x86,arm64}_dev_factory.py
# builders + do_apt_trixie_dev.sh.

on:
  push:
    branches:
      - pyside6

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: debian:trixie
    steps:
      - name: Install build prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates build-essential devscripts dpkg-dev python3-pip

      - name: Checkout source
        uses: actions/checkout@v7
        with:
          path: source
          fetch-depth: 0
          fetch-tags: true

      - name: Install package build-deps
        working-directory: source
        run: |
          apt-get build-dep -y .
          # debian/rules' override_dh_install runs the built package's own
          # qcompile tool to compile .ui/.qrc files, which self-imports
          # "qtpyvcp" -- make that importable before the build runs.
          pip install --break-system-packages --no-build-isolation --no-deps -e .

      - name: Create changelog entry
        working-directory: source
        env:
          EMAIL: j.l.toledano.l@gmail.com
        run: |
          LATEST_TAG="$(git describe --abbrev=0 --tags)"
          COUNT="$(git rev-list --count "${LATEST_TAG}..HEAD")"
          VERSION="${LATEST_TAG#v}-${COUNT}.dev"
          rm -f debian/changelog
          dch --create --distribution unstable --package qtpyvcp \
            --newversion "${VERSION}" "Development version."

      - name: Build package
        working-directory: source
        env:
          DEB_BUILD_OPTIONS: nocheck
        run: dpkg-buildpackage -b -uc

      - name: Upload built package
        uses: actions/upload-artifact@v7
        with:
          name: qtpyvcp-trixie-dev-${{ matrix.arch }}
          path: '*.deb'
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download built packages
        uses: actions/download-artifact@v8
        with:
          pattern: qtpyvcp-trixie-dev-*
          path: debs
          merge-multiple: true

      - name: Checkout apt repo
        uses: actions/checkout@v7
        with:
          repository: kcjengr/apt
          path: apt-repo
          token: ${{ secrets.APT_REPO_TOKEN }}

      - name: Import GPG signing key
        run: echo "${{ secrets.APT_GPG_PRIVATE_KEY }}" | base64 -d | gpg --batch --import

      - name: Publish suite(s) and push (retries on concurrent-publish races)
        working-directory: apt-repo
        env:
          GPG_KEY_ID: 0CDFCCE0388CFA48
        run: |
          set -euo pipefail
          git config user.name "kcjengr-bot"
          git config user.email "actions@github.com"
          for attempt in 1 2 3 4 5; do
            mkdir -p "apt/pool/main/trixie-dev"
            cp ../debs/*.deb "apt/pool/main/trixie-dev/"
            ./scripts/publish-suite.sh trixie-dev trixie-dev amd64 arm64

            git add -A
            if git diff --cached --quiet; then
              echo "no changes to publish"
              exit 0
            fi
            git commit -m "Publish qtpyvcp dev build ${{ github.sha }} (trixie-dev)"
            if git push; then
              echo "published on attempt ${attempt}"
              exit 0
            fi
            echo "push rejected (attempt ${attempt}/5) -- another repo published to kcjengr/apt at the same time, re-syncing and retrying"
            branch="$(git rev-parse --abbrev-ref HEAD)"
            git fetch origin "$branch"
            git reset --hard "origin/$branch"
            sleep $(( (RANDOM % 8) + attempt * 2 ))
          done
          echo "::error::failed to push to kcjengr/apt after 5 attempts"
          exit 1

  docs:
    # Rebuilds www.qtpyvcp.com (the gh-pages branch) on every push, as the
    # buildbot's pyside6 dev factory did. Full build only: that factory used
    # the html-preview target, which leaves out the reference sections, and
    # that is how they went missing from the site.
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie
    permissions:
      contents: write
    concurrency:
      group: docs-gh-pages
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    steps:
      - name: Install docs build prerequisites
        run: |
          apt-get update
          # Every Debian package the docs build imported, traced from a
          # working build. List them all: packages that look optional
          # (python3-dateutil) are imported directly by qtpyvcp modules.
          # Sphinx and its extensions come from pip.
          apt-get install -y --no-install-recommends \
            git ca-certificates make python3-pip \
            python3-pyside6.qtcore python3-pyside6.qtgui \
            python3-pyside6.qtwidgets python3-pyside6.qtdbus \
            python3-pyside6.qtuitools python3-pyqtgraph python3-numpy \
            python3-bottleneck python3-dbus python3-distro python3-docopt \
            python3-psutil python3-pyudev python3-serial python3-simpleeval \
            python3-yaml python3-jinja2 python3-markupsafe python3-setuptools \
            python3-dateutil python3-pytz python3-pil python3-defusedxml \
            python3-babel python3-pygments python3-packaging python3-requests \
            python3-urllib3 python3-idna python3-certifi python3-chardet \
            python3-charset-normalizer python3-brotli python3-typing-extensions
          pip install --break-system-packages \
            sphinx sphinx-rtd-theme sphinx-notfound-page sphinx-gitstamp

      - name: Checkout source
        uses: actions/checkout@v7
        with:
          path: source
          fetch-depth: 0

      - name: Build docs
        working-directory: source/docs
        run: |
          # sphinx-gitstamp reads each page's git history.
          git config --global --add safe.directory '*'
          # -W fails the build on any Sphinx warning, such as a module
          # autodoc cannot import, instead of publishing an empty page.
          make html SPHINXOPTS="-W --keep-going"

      - name: Checkout gh-pages
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: site

      - name: Publish to gh-pages
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/source/docs/build/html"
          # Refuse to publish a site that is missing the reference sections,
          # or has them but empty.
          for page in actions/index.html widgets/index.html plugins/index.html \
                      designer/widgets/index.html designer/plugins/index.html \
                      components/index.html tools/index.html; do
            if [ ! -f "$OUT/$page" ]; then
              echo "::error::docs build has no $page, not publishing"
              exit 1
            fi
          done
          if ! grep -q 'id="qtpyvcp.actions.machine_actions.' "$OUT/actions/machine_actions.html"; then
            echo "::error::docs build has an empty machine actions page, not publishing"
            exit 1
          fi
          if ! grep -qx 'www.qtpyvcp.com' "$OUT/CNAME" || [ ! -f "$OUT/.nojekyll" ]; then
            echo "::error::docs build is missing CNAME or .nojekyll, not publishing"
            exit 1
          fi
          cd site
          git rm -rq .
          cp -a "$OUT/." .
          git add -A
          if git diff --cached --quiet; then
            echo "docs unchanged, nothing to publish"
            exit 0
          fi
          git config user.name "kcjengr-bot"
          git config user.email "actions@github.com"
          git commit -m "Deploy docs from pyside6 ${GITHUB_SHA::8}"
          git push origin gh-pages
